[package]
name = "cadre"
version = "0.1.0"
edition = "2021"

[lib]
name = "cadre_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "cadre"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
notify = "7"
glob = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
# OS keychain for the SecretsStore (§3.6). apple-native = macOS Keychain.
# Add windows-native / sync-secret-service when building for those targets.
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
