name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Typecheck, build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # tsconfig sets strict + noUnusedLocals + noUnusedParameters, so this is the
      # real gate: an unused import fails the build rather than only the linter.
      - name: Typecheck & build
        run: npm run build

      - name: Test
        run: npm test

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri links against the webkit2gtk stack on Linux even for `cargo test`.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            librsvg2-dev \
            patchelf

      # tauri.conf.json points frontendDist at ../dist, and tauri_build::build()
      # fails if it is missing. The Rust tests never read the bundle, so a stub is
      # enough — this keeps the job independent of the (slower) frontend build.
      - name: Stub frontend dist
        run: |
          mkdir -p dist
          echo '<!doctype html><title>ci-stub</title>' > dist/index.html

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml
